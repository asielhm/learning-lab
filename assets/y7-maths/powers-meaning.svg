<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="Addition: two lengths a end to end make 2a. Multiplication: a square of side a has area a times a, written a squared."><rect width="720" height="300" rx="20" fill="#f4f7f0"/><g font-family="system-ui" text-anchor="middle" fill="#345e4b"><text x="180" y="38" font-size="19" font-weight="700">ADD TWO LENGTHS</text><rect x="55" y="100" width="125" height="37" rx="5" fill="#e1cef1" stroke="#9e7fbb"/><rect x="180" y="100" width="125" height="37" rx="5" fill="#d4e8d6" stroke="#78a386"/><text x="117" y="124" font-size="21">a</text><text x="242" y="124" font-size="21">a</text><text x="180" y="185" font-size="27" font-weight="700">a + a = 2a</text><text x="180" y="222" font-size="15">Two copies of the same length.</text><text x="180" y="247" font-size="15">Length units stay length units.</text><path d="M355 50V260" stroke="#c7d8c9"/><text x="535" y="38" font-size="19" font-weight="700">MULTIPLY TWO LENGTHS</text><rect x="475" y="76" width="120" height="120" rx="5" fill="#e1cef1" stroke="#9e7fbb" stroke-width="2"/><text x="535" y="146" font-size="29">a²</text><text x="535" y="65" font-size="20">a</text><text x="457" y="145" font-size="20">a</text><text x="535" y="237" font-size="27" font-weight="700">a × a = a²</text><text x="535" y="270" font-size="14">Area uses square units; assume a is a positive length.</text></g></svg>
