<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" role="img" aria-label="Un solo reloj: B espera hasta 4 s; después A y B se encuentran a los 10 s en 30 m. Gráfico esquemático con posición vertical."><rect width="620" height="290" rx="18" fill="#f5f8fc"/><g font-family="system-ui,sans-serif" fill="#29445c"><path d="M70 225L565 225" fill="none" stroke="#537491" stroke-width="3"/><path d="M70 225L70 35" fill="none" stroke="#537491" stroke-width="3"/><path d="M70 175L520 75" fill="none" stroke="#8d6bc0" stroke-width="4"/><path d="M70 225L250 225" fill="none" stroke="#279b8e" stroke-width="4"/><path d="M250 225L520 75" fill="none" stroke="#279b8e" stroke-width="4"/><circle cx="520" cy="75" r="7" fill="#d88855"/><text x="550" y="255" font-size="20" text-anchor="middle">t / s</text><text x="43" y="27" font-size="20" text-anchor="middle">x / m</text><text x="385" y="50" font-size="18" text-anchor="middle">A: 10 + 2t</text><text x="360" y="190" font-size="17" text-anchor="middle">B: 5(t − 4), t ≥ 4</text><text x="505" y="108" font-size="15" text-anchor="middle">(10 s, 30 m)</text></g></svg>