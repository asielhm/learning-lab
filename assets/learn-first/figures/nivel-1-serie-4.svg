<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" role="img" aria-label="Las semirreacciones contabilizan los mismos electrones. No se generan ni se eliminan electrones sin proceso complementario."><rect width="620" height="290" rx="18" fill="#f5f8fc"/><g font-family="system-ui,sans-serif" fill="#29445c"><rect x="45" y="65" width="240" height="100" rx="10" fill="#d8edf3"/><rect x="335" y="65" width="240" height="100" rx="10" fill="#e4daf4"/><text x="165" y="105" font-size="20" text-anchor="middle">Zn → Zn²⁺ + 2e⁻</text><text x="455" y="105" font-size="20" text-anchor="middle">Cu²⁺ + 2e⁻ → Cu</text><text x="165" y="143" font-size="17" text-anchor="middle">Oxidación: cede</text><text x="455" y="143" font-size="17" text-anchor="middle">Reducción: recibe</text><path d="M235 210L385 210" fill="none" stroke="#299b8d" stroke-width="4"/><path d="M375.0 204.0L385 210L375.0 216.0" fill="none" stroke="#299b8d" stroke-width="4"/><text x="310" y="245" font-size="20" text-anchor="middle">2e⁻</text></g></svg>