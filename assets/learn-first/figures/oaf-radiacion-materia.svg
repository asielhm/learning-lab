<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" role="img" aria-label="En el efecto fotoeléctrico ideal, frecuencia controla energía por fotón. Aumentar intensidad no reemplaza una frecuencia por debajo del umbral."><rect width="620" height="290" rx="18" fill="#f5f8fc"/><g font-family="system-ui,sans-serif" fill="#29445c"><rect x="40" y="60" width="240" height="150" rx="10" fill="#e6edf6"/><rect x="340" y="60" width="240" height="150" rx="10" fill="#e5dcf4"/><text x="160" y="100" font-size="20" text-anchor="middle">hf &lt; Φ</text><text x="160" y="155" font-size="17" text-anchor="middle">No emite electrones</text><text x="460" y="100" font-size="20" text-anchor="middle">hf &gt; Φ</text><text x="460" y="155" font-size="20" text-anchor="middle">Kmax = hf − Φ</text><circle cx="560" cy="175" r="9" fill="#299c8e"/></g></svg>