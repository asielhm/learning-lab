<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 290" role="img" aria-label="Instante de deslizamiento hacia la derecha. La fuerza neta determina aceleración, que no es lo mismo que velocidad."><rect width="620" height="290" rx="18" fill="#f5f8fc"/><g font-family="system-ui,sans-serif" fill="#29445c"><rect x="235" y="100" width="150" height="100" rx="10" fill="#c0afe6"/><text x="310" y="155" font-size="30" text-anchor="middle">5 kg</text><path d="M385 140L560 140" fill="none" stroke="#299b8d" stroke-width="4"/><path d="M550.0 134.0L560 140L550.0 146.0" fill="none" stroke="#299b8d" stroke-width="4"/><text x="480" y="110" font-size="20" text-anchor="middle">20 N</text><path d="M235 140L130 140" fill="none" stroke="#d98668" stroke-width="4"/><path d="M140.0 146.0L130 140L140.0 134.0" fill="none" stroke="#d98668" stroke-width="4"/><text x="130" y="110" font-size="20" text-anchor="middle">5 N</text><path d="M235 190L130 190" fill="none" stroke="#d2a339" stroke-width="4"/><path d="M140.0 196.0L130 190L140.0 184.0" fill="none" stroke="#d2a339" stroke-width="4"/><text x="130" y="220" font-size="17" text-anchor="middle">Roce: 5 N</text><text x="350" y="260" font-size="19" text-anchor="middle">Fnet = 20 − 5 − 5 = 10 N → a = 2 m/s²</text></g></svg>