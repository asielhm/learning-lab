<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" role="img" aria-label="Numbered three-carbon alcohol chains: terminal OH gives propan-1-ol; middle OH gives propan-2-ol"><rect width="900" height="480" rx="20" fill="#ecf4ed"/><rect x="15" y="15" width="870" height="206" rx="15" fill="#fffdf8"/><rect x="15" y="239" width="870" height="226" rx="15" fill="#fffdf8"/><text x="40" y="49" font-family="system-ui,sans-serif" font-size="24" fill="#294b42" text-anchor="start">Propan-1-ol: begin at the OH end</text><circle cx="140" cy="87" r="17" fill="#277f86"/><text x="140" y="93" font-family="system-ui,sans-serif" font-size="18" fill="white" text-anchor="middle">3</text><circle cx="310" cy="87" r="17" fill="#277f86"/><text x="310" y="93" font-family="system-ui,sans-serif" font-size="18" fill="white" text-anchor="middle">2</text><circle cx="480" cy="87" r="17" fill="#277f86"/><text x="480" y="93" font-family="system-ui,sans-serif" font-size="18" fill="white" text-anchor="middle">1</text><text x="140" y="144" font-family="system-ui,sans-serif" font-size="30" fill="#294b42" text-anchor="middle">CH₃</text><line x1="180" y1="134" x2="265" y2="134" stroke="#304f57" stroke-width="4" stroke-linecap="round"/><text x="310" y="144" font-family="system-ui,sans-serif" font-size="30" fill="#294b42" text-anchor="middle">CH₂</text><line x1="350" y1="134" x2="435" y2="134" stroke="#304f57" stroke-width="4" stroke-linecap="round"/><text x="480" y="144" font-family="system-ui,sans-serif" font-size="30" fill="#294b42" text-anchor="middle">CH₂</text><line x1="520" y1="134" x2="600" y2="134" stroke="#304f57" stroke-width="4" stroke-linecap="round"/><text x="650" y="144" font-family="system-ui,sans-serif" font-size="30" fill="#167a81" text-anchor="middle">OH</text><text x="450" y="196" font-family="system-ui,sans-serif" font-size="19" fill="#294b42" text-anchor="middle">Lowest OH position: 1, not 3.</text><text x="40" y="273" font-family="system-ui,sans-serif" font-size="24" fill="#294b42" text-anchor="start">Propan-2-ol: OH belongs to the middle carbon</text><circle cx="200" cy="310" r="17" fill="#277f86"/><text x="200" y="316" font-family="system-ui,sans-serif" font-size="18" fill="white" text-anchor="middle">1</text><circle cx="440" cy="310" r="17" fill="#277f86"/><text x="440" y="316" font-family="system-ui,sans-serif" font-size="18" fill="white" text-anchor="middle">2</text><circle cx="680" cy="310" r="17" fill="#277f86"/><text x="680" y="316" font-family="system-ui,sans-serif" font-size="18" fill="white" text-anchor="middle">3</text><text x="200" y="367" font-family="system-ui,sans-serif" font-size="30" fill="#294b42" text-anchor="middle">CH₃</text><line x1="243" y1="357" x2="400" y2="357" stroke="#304f57" stroke-width="4" stroke-linecap="round"/><text x="440" y="367" font-family="system-ui,sans-serif" font-size="30" fill="#294b42" text-anchor="middle">CH</text><line x1="479" y1="357" x2="637" y2="357" stroke="#304f57" stroke-width="4" stroke-linecap="round"/><text x="680" y="367" font-family="system-ui,sans-serif" font-size="30" fill="#294b42" text-anchor="middle">CH₃</text><line x1="440" y1="379" x2="440" y2="412" stroke="#167a81" stroke-width="4" stroke-linecap="round"/><text x="440" y="447" font-family="system-ui,sans-serif" font-size="30" fill="#167a81" text-anchor="middle">OH</text></svg>