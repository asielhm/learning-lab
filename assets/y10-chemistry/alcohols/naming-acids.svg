<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Propanoic acid numbered from the carboxyl carbon: COOH carbon is 1, CH2 carbon 2, CH3 carbon 3"><rect width="900" height="340" rx="20" fill="#f6eee2"/><text x="35" y="44" font-family="system-ui,sans-serif" font-size="25" fill="#294b42" text-anchor="start">Propanoic acid: include the carboxyl carbon</text><text x="160" y="178" font-family="system-ui,sans-serif" font-size="30" fill="#294b42" text-anchor="middle">CH₃</text><line x1="204" y1="168" x2="281" y2="168" stroke="#304f57" stroke-width="4" stroke-linecap="round"/><text x="330" y="178" font-family="system-ui,sans-serif" font-size="30" fill="#294b42" text-anchor="middle">CH₂</text><line x1="374" y1="168" x2="482" y2="168" stroke="#304f57" stroke-width="4" stroke-linecap="round"/><g transform="translate(500 168) scale(0.88)" data-acid-structure=""><rect x="-174" y="-28" width="140" height="58" rx="12" fill="transparent"/><text x="-48" y="9" font-family="system-ui,sans-serif" font-size="28" fill="#294b42" text-anchor="end"></text><line x1="-35" y1="0" x2="-14" y2="0" stroke="#304f57" stroke-width="4" stroke-linecap="round"/><path d="M-17-33Q-17-45 0-45H15L48-104H106V108H41L10 44H-17Z" fill="#ffe9c6" stroke="#d48b42" stroke-width="2"/><text x="0" y="9" font-family="system-ui,sans-serif" font-size="29" fill="#a64235" text-anchor="middle">C</text><line x1="12" y1="-18" x2="42" y2="-70" stroke="#a64235" stroke-width="4" stroke-linecap="round"/><line x1="21" y1="-13" x2="51" y2="-65" stroke="#a64235" stroke-width="4" stroke-linecap="round"/><text x="62" y="-78" font-family="system-ui,sans-serif" font-size="30" fill="#a64235" text-anchor="middle">O</text><line x1="14" y1="18" x2="46" y2="73" stroke="#a64235" stroke-width="4" stroke-linecap="round"/><text x="65" y="100" font-family="system-ui,sans-serif" font-size="29" fill="#a64235" text-anchor="middle">OH</text></g><circle cx="160" cy="106" r="18" fill="#a64235"/><text x="160" y="112" font-family="system-ui,sans-serif" font-size="18" fill="white" text-anchor="middle">3</text><circle cx="330" cy="106" r="18" fill="#a64235"/><text x="330" y="112" font-family="system-ui,sans-serif" font-size="18" fill="white" text-anchor="middle">2</text><circle cx="472" cy="231" r="18" fill="#a64235"/><text x="472" y="237" font-family="system-ui,sans-serif" font-size="18" fill="white" text-anchor="middle">1</text><text x="450" y="308" font-family="system-ui,sans-serif" font-size="21" fill="#294b42" text-anchor="middle">Three carbons altogether → propanoic acid. COOH carbon is carbon 1.</text></svg>