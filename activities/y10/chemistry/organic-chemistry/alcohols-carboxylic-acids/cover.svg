<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Alcohols · Carboxylic acids</title><desc id="desc">Alcohol: CH₃–CH₂–OH. Carboxylic acid: CH₃–C(=O)–OH. Same O–H letters. Different neighbours. Different reactions.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#eef5ef"/><stop offset="1" stop-color="#fff2de"/></linearGradient></defs><rect width="800" height="500" rx="24" fill="url(#paper)"/><circle cx="720" cy="70" r="100" fill="#277f86" opacity=".08"/><g font-family="system-ui,sans-serif"><text x="42" y="56" fill="#277f86" font-size="17" font-weight="750" letter-spacing="2">CLASS 01 · ORGANIC CHEMISTRY</text><text x="42" y="106" fill="#264d43" font-size="32" font-weight="750">Alcohols · Carboxylic acids</text><rect x="40" y="141" width="720" height="112" rx="18" fill="white" stroke="#c1d6c8"/><text x="64" y="176" fill="#277f86" font-size="18" font-weight="650">Alcohol</text><text x="400" y="222" fill="#294b42" font-size="30" text-anchor="middle">CH₃–CH₂–OH</text><rect x="40" y="277" width="720" height="112" rx="18" fill="white" stroke="#c1d6c8"/><text x="64" y="312" fill="#277f86" font-size="18" font-weight="650">Carboxylic acid</text><text x="400" y="358" fill="#294b42" font-size="30" text-anchor="middle">CH₃–C(=O)–OH</text><text x="400" y="444" fill="#526c60" font-size="19" text-anchor="middle">Same O–H letters. Different neighbours. Different reactions.</text></g></svg>