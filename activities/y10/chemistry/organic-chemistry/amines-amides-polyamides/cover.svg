<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Amines · Amides · Polyamides</title><desc id="desc">Amine: CH₃–NH₂. Amide: CH₃–C(=O)–NH₂. Find nitrogen. Look next door for C=O.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#eef5ef"/><stop offset="1" stop-color="#fff2de"/></linearGradient></defs><rect width="800" height="500" rx="24" fill="url(#paper)"/><circle cx="720" cy="70" r="100" fill="#6d58a5" opacity=".08"/><g font-family="system-ui,sans-serif"><text x="42" y="56" fill="#6d58a5" font-size="17" font-weight="750" letter-spacing="2">CLASS 03 · ORGANIC CHEMISTRY</text><text x="42" y="106" fill="#264d43" font-size="32" font-weight="750">Amines · Amides · Polyamides</text><rect x="40" y="141" width="720" height="112" rx="18" fill="white" stroke="#c1d6c8"/><text x="64" y="176" fill="#6d58a5" font-size="18" font-weight="650">Amine</text><text x="400" y="222" fill="#294b42" font-size="30" text-anchor="middle">CH₃–NH₂</text><rect x="40" y="277" width="720" height="112" rx="18" fill="white" stroke="#c1d6c8"/><text x="64" y="312" fill="#6d58a5" font-size="18" font-weight="650">Amide</text><text x="400" y="358" fill="#294b42" font-size="30" text-anchor="middle">CH₃–C(=O)–NH₂</text><text x="400" y="444" fill="#526c60" font-size="19" text-anchor="middle">Find nitrogen. Look next door for C=O.</text></g></svg>