<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-labelledby="title desc"><title id="title">Esters · Polyesters</title><desc id="desc">Small ester: CH₃–C(=O)–O–CH₂–CH₃. Polyester links: –C(=O)–O–R–O–C(=O)–. One link → repeated links → useful materials.</desc><defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#eef5ef"/><stop offset="1" stop-color="#fff2de"/></linearGradient></defs><rect width="800" height="500" rx="24" fill="url(#paper)"/><circle cx="720" cy="70" r="100" fill="#b55f34" opacity=".08"/><g font-family="system-ui,sans-serif"><text x="42" y="56" fill="#b55f34" font-size="17" font-weight="750" letter-spacing="2">CLASS 02 · ORGANIC CHEMISTRY</text><text x="42" y="106" fill="#264d43" font-size="32" font-weight="750">Esters · Polyesters</text><rect x="40" y="141" width="720" height="112" rx="18" fill="white" stroke="#c1d6c8"/><text x="64" y="176" fill="#b55f34" font-size="18" font-weight="650">Small ester</text><text x="400" y="222" fill="#294b42" font-size="30" text-anchor="middle">CH₃–C(=O)–O–CH₂–CH₃</text><rect x="40" y="277" width="720" height="112" rx="18" fill="white" stroke="#c1d6c8"/><text x="64" y="312" fill="#b55f34" font-size="18" font-weight="650">Polyester links</text><text x="400" y="358" fill="#294b42" font-size="30" text-anchor="middle">–C(=O)–O–R–O–C(=O)–</text><text x="400" y="444" fill="#526c60" font-size="19" text-anchor="middle">One link → repeated links → useful materials.</text></g></svg>