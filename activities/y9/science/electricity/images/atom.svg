<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" ><rect width="840" height="300" rx="22" fill="#edf2fb"/><ellipse cx="210" cy="150" rx="145" ry="95" fill="none" stroke="#b0c6e1" stroke-width="3"/><circle cx="210" cy="150" r="42" fill="#ffe8b0"/><g transform="translate(195 141)"><circle r="15" fill="#e27863" stroke="#a53e33" stroke-width="2"/><text x="0" y="5" font-size="19" fill="#fff" text-anchor="middle">+</text></g><g transform="translate(225 158)"><circle r="15" fill="#e27863" stroke="#a53e33" stroke-width="2"/><text x="0" y="5" font-size="19" fill="#fff" text-anchor="middle">+</text></g><circle cx="221" cy="132" r="13" fill="#90a4b7"/><circle cx="194" cy="169" r="13" fill="#90a4b7"/><g transform="translate(67 150)"><circle r="15" fill="#4183d4" stroke="#1951a0" stroke-width="2"/><text x="0" y="5" font-size="20" fill="#fff" text-anchor="middle">−</text></g><g transform="translate(335 105)"><circle r="15" fill="#4183d4" stroke="#1951a0" stroke-width="2"/><text x="0" y="5" font-size="20" fill="#fff" text-anchor="middle">−</text></g><text x="410" y="70" font-size="28" fill="#19384c" >Meet the atom</text><text x="410" y="112" font-size="20" fill="#19384c" >Proton: positive (+), in the nucleus</text><text x="410" y="151" font-size="20" fill="#19384c" >Neutron: no charge, in the nucleus</text><text x="410" y="190" font-size="20" fill="#19384c" >Electron: negative (−), outside it</text><text x="410" y="242" font-size="20" fill="#6d4cc2" >Balanced charges → neutral atom</text></svg>