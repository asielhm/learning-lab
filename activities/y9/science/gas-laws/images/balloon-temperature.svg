<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">A sealed balloon expands as its gas warms</title><desc id="desc">A smaller cool balloon and a larger warm balloon illustrate thermal expansion at approximately constant external pressure. Both contain the same amount of gas.</desc><defs><radialGradient id="cool" cx=".3" cy=".3"><stop stop-color="#b9dce7"/><stop offset="1" stop-color="#56849b"/></radialGradient><radialGradient id="warm" cx=".3" cy=".3"><stop stop-color="#f1c8a8"/><stop offset="1" stop-color="#c87e66"/></radialGradient></defs><rect width="720" height="430" rx="20" fill="#f4f4ee"/><g fill="none" stroke="#66838a" stroke-width="2"><path d="M212 291c-18 25 21 43 3 62m293-53c-21 20 17 40-1 57"/></g><ellipse cx="212" cy="219" rx="76" ry="88" fill="url(#cool)" stroke="#52788b" stroke-width="2"/><path d="m204 302 8-16 8 16z" fill="#6c9aae"/><ellipse cx="508" cy="206" rx="99" ry="108" fill="url(#warm)" stroke="#ba775f" stroke-width="2"/><path d="m498 311 10-18 10 18z" fill="#cb856d"/><g fill="#eef5ed" opacity=".85"><circle cx="184" cy="200" r="4"/><circle cx="230" cy="179" r="4"/><circle cx="215" cy="231" r="4"/><circle cx="180" cy="251" r="4"/><circle cx="247" cy="231" r="4"/><circle cx="226" cy="271" r="4"/><circle cx="470" cy="183" r="4"/><circle cx="535" cy="146" r="4"/><circle cx="511" cy="229" r="4"/><circle cx="465" cy="266" r="4"/><circle cx="555" cy="230" r="4"/><circle cx="524" cy="287" r="4"/></g><path d="M326 224h59m-14-14 14 14-14 14" fill="none" stroke="#618d82" stroke-width="3"/><g font-family="system-ui,sans-serif" fill="#254653"><text x="42" y="55" font-size="13" letter-spacing="2">CHARLES · A FLEXIBLE GAS CONTAINER</text><text x="42" y="87" font-size="23" font-weight="600">Warmer gas occupies more space.</text><text x="148" y="366" font-size="15">Cooler gas</text><text x="453" y="366" font-size="15">Warmer gas</text><text x="43" y="408" font-size="11" fill="#6d827f">Concept 