<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">A sealed syringe illustrates Boyle–Mariotte's law</title><desc id="desc">A capped syringe contains a fixed sample of air. Pushing the plunger reduces gas volume while temperature stays constant.</desc><defs><linearGradient id="barrel" x2="0" y2="1"><stop stop-color="#d9eef0"/><stop offset=".5" stop-color="#f9ffff"/><stop offset="1" stop-color="#b8d9df"/></linearGradient><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#b1c6cd"/><stop offset=".5" stop-color="#ecf3f5"/><stop offset="1" stop-color="#8ca8b3"/></linearGradient></defs><rect width="720" height="430" rx="20" fill="#edf5f7"/><ellipse cx="363" cy="320" rx="253" ry="18" fill="#bed0d4" opacity=".35"/><g stroke="#456877" stroke-width="3"><rect x="153" y="165" width="306" height="121" rx="12" fill="url(#barrel)"/><path d="M153 204H114v40h39" fill="#dce8e9"/><path d="M115 198H88v53h27" fill="#426c7d"/><rect x="370" y="169" width="20" height="113" rx="4" fill="#438b98"/><rect x="389" y="211" width="195" height="29" rx="3" fill="url(#metal)"/><rect x="581" y="174" width="23" height="103" rx="6" fill="url(#metal)"/><path d="M452 146v161" stroke-width="10" stroke-linecap="round"/></g><g stroke="#7899a6" stroke-width="2"><path d="M190 166v20m30-20v11m30-11v20m30-20v11m30-11v20m30-20v11"/></g><g fill="#d68c59"><circle cx="193" cy="220" r="5"/><circle cx="225" cy="251" r="5"/><circle cx="263" cy="208" r="5"/><circle cx="300" cy="246" r="5"/><circle cx="334" cy="217" r="5"/><circle cx="180" cy="263" r="5"/><circle cx="278" cy="273" r="5"/><circle cx="348" cy="266" r="5"/></g><g fill="none" stroke="#bc6553" stroke-width="5" stroke-linecap="round"><path d="M580 120H490m20-17-20 17 20 17"/></g><g font-family="system-ui,sans-serif" fill="#254653"><text x="46" y="58" font-size="13" letter-spacing="2">BOYLE–MARIOTTE · A FIXED SAMPLE OF AIR</text><text x="46" y="89" font-size="23" font-weight="600">Smaller volume. Greater pressure.</text><text x="513" y="104" font-size="14">Push the plunger</text><text x="42" y="366" font-size="14">Capped tip</text><text x="237" y="365" font-size="14">Sealed air sample</text><text x="453" y="365" font-size="14">Temperature held constant</text></g><g fill="none" stroke="#74939d" stroke-width="1.5"><path d="M93 346V257M296 345V292M546 343V285"/></g><text x="46" y="405" font-family="system-ui,sans-serif" font-size="11" fill="#66828c">Concept illustration · not to scale · no gas enters or leaves</text></svg>
