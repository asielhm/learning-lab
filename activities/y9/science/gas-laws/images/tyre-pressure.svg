<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 430" role="img" aria-labelledby="title desc"><title id="title">Gas warming inside a bicycle tyre can increase its pressure</title><desc id="desc">A bicycle wheel with an attached pressure gauge illustrates increasing pressure in a nearly fixed-volume gas container. A rigid vessel is the closer ideal-gas model.</desc><defs><radialGradient id="tyre"><stop offset=".73" stop-color="#374c57"/><stop offset=".86" stop-color="#18343f"/><stop offset="1" stop-color="#4a6570"/></radialGradient></defs><rect width="720" height="430" rx="20" fill="#edf4f4"/><ellipse cx="295" cy="366" rx="181" ry="15" fill="#a8c1c4" opacity=".2"/><circle cx="285" cy="235" r="122" fill="url(#tyre)"/><circle cx="285" cy="235" r="96" fill="#edf4f4" stroke="#869fa4" stroke-width="5"/><g stroke="#9db1b4" stroke-width="2"><path d="M285 141v188M191 235h188M219 169l132 132M219 301l132-132M249 148l72 174M198 199l174 72M198 271l174-72M249 322l72-174"/></g><circle cx="285" cy="235" r="13" fill="#4d7480"/><path d="M381 244h32c14 0 19-12 20-34l2-21" fill="none" stroke="#536b70" stroke-width="7"/><circle cx="485" cy="177" r="56" fill="#d8e5e5" stroke="#64808b" stroke-width="5"/><circle cx="485" cy="177" r="44" fill="#fffef5"/><path d="M452 173a34 34 0 0 1 62 0" fill="none" stroke="#9eb8b2" stroke-width="4"/><path d="m485 177 19-27" stroke="#bd6c58" stroke-width="4"/><circle cx="485" cy="177" r="5" fill="#3c5963"/><g fill="none" stroke="#cc9164" stroke-width="3"><path d="M573 240c-15-17 15-25 0-42m24 42c-15-17 15-25 0-42m24 42c-15-17 15-25 0-42"/></g><g font-family="system-ui,sans-serif" fill="#254653"><text x="42" y="55" font-size="13" letter-spacing="2">GAY-LUSSAC · APPROXIMATELY FIXED VOLUME</text><text x="42" y="87" font-size="23" font-weight="600">Warm the gas. Watch the pressure.</text><text x="436" y="271" font-size="13">Tyre pressure can change</text><text x="436" y="291" font-size="13">with gas temperature.</text><text x="42" y="406" font-size="11" fill="#6c858c">Concept illustration · a rigid sealed container is the closer constant-volume model</text></g></svg>
